# Mid-function hooks for the recompiler (included from perfectdarkzerorecomp_manifest.toml).
# Each entry calls a C++ function just before the instruction at `address`; with
# jump_address_on_true the code jumps there when it returns true. Changing this file re-runs codegen.

# --- src/fixes/tu_fixes.cpp: Title Update 3 fixes.
# From PerfectDarkZeroRestored (MIT) midasm_hooks.toml; launch addresses, TU3 targets in comments.

# U7: Datacore script null check on +2592 (TU3 822FFDC8).
[[midasm_hook]]
address = 0x822F89A0
name = "PdzTuDatacoreNull"
registers = ["r31"]
jump_address_on_true = 0x822F8CDC

