# perfectdarkzerorecomp - hardware / rendering settings
#
# Loaded automatically at startup (see OnConfigurePaths in
# src/perfectdarkzerorecomp_app.h) and rewritten by the in-game Settings
# overlay's "Save to config" button. --flag on the command line and REX_*
# environment variables always override values from this file - see
# ../settings/README.md.
#
# Flat key = value only

gpu_plugin = "xenos"

# "any" (d3d12 - win default, vulkan - lin default)
# "d3d11" / "d3d12" / "vulkan"
graphics_backend = "any"
vsync = true
resolution_scale = 2
present_effect = "fsr"
present_fsr_sharpness_reduction = 0.2
present_dither = true
swap_post_effect = "smaa"
async_shader_compilation = true
native_2x_msaa = false
anisotropic_override = 5

texture_cache_memory_limit_soft = 1024
texture_cache_memory_limit_hard = 4096
clear_memory_page_state = false
readback_memexport = false
readback_memexport_fast = false
readback_resolve = "none"
host_present_from_non_ui_thread	= true
gpu_allow_invalid_fetch_constants = true
depth_bias_shader_offset = true
async_depth_only_pipelines = true

window_width = 1920
window_height = 1080
fullscreen = true
monitor = 0
resolution = "1920x1080"

render_target_path_d3d12 = "rtv"
store_shaders = true
present_letterbox = true
  
d3d12_adapter = -1
d3d12_allow_variable_refresh_rate_and_tearing = true
d3d12_bindless = true
d3d12_break_on_error = false
d3d12_break_on_warning = false
d3d12_debug = false
d3d12_dxbc_disasm = false
d3d12_dxbc_disasm_dxilconv = false
d3d12_pipeline_creation_threads = -1
d3d12_queue_priority = 2
d3d12_submit_on_primary_buffer_end = true
d3d12_tessellation_wireframe = false
d3d12_readback_resolve = false

render_target_path_vulkan = "fbo"
vulkan_log_debug_messages = false
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_fifo_relaxed = false
vulkan_allow_present_mode_mailbox = true
vulkan_async_skip_incomplete_frames = false
vulkan_force_convert_quad_lists_to_triangle_lists = true
vulkan_hoist_shared_memory_uploads = true
vulkan_max_frames_in_flight = 2
vulkan_allow_present_mode_fifo_latest_ready = true
vulkan_resolve_into_textures = true

d3d11_adapter = -1
d3d11_feature_level = "11_0"
d3d11_block_compressed_textures = true
d3d11_resolve_into_textures = false
d3d11_debug = false

headless = false

# trace, debug, info, warn, error, critical
log_level = "error"

# Perf CSV log path (per-frame metrics). Empty = disabled.
# Only works when REXGLUE_ENABLE_PERF_COUNTERS is defined (non-Release).
#perf_log_csv = "benchmark.csv"

# Enable runtime debug tools (stub sweep, missing function scan).
# Produces logs/missed_functions.txt and logs/stub_sweep.txt.
dev_debug_runtime = false

# Ported xenia-canary game-patches for PDZ retail (4D5307D3).
# https://github.com/xenia-canary/game-patches/blob/main/patches/4D5307D3%20-%20Perfect%20Dark%20Zero.patch.toml
pdz_fps60_unlock = true
pdz_aspect_ratio_16_9 = false

# Vertical FoV before aiming/zoom. Original: 58; range: 40-120.
pdz_fov = 58.0

# 0 = busy spin (original), 1 = yield the core, 2 = sleep 200us
pdz_gpu_wait_mode = 1

# Third-person camera, toggled in game with bind_third_person (V).
# Camera-local offset in ~cm; z < 0 = behind. See src/mod/README.md.
pdz_tp_enable = false
pdz_tp_offset_x = -80.0
pdz_tp_offset_y = 10.0
pdz_tp_offset_z = -320.0

# Xbox locale language:
#  1 = English      2 = Japanese     3 = German      4 = French
#  5 = Spanish      6 = Italian      7 = Korean      8 = Traditional Chinese
#  9 = Portuguese  10 = Simplified Chinese  11 = Polish  12 = Russian
##
# Languages without implementation in your legal disk will fall back to English.
##
user_language = 1

# Split-screen: local players and their controllers (see split-screen.md).
max_local_users = 4
#keyboard_own_player = true
